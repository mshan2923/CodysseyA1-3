<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Kakao Map Test</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=83507e9b1676927c35fab75c25d3cb66"></script>
<style>
  html,body{margin:0;height:100%}
  #map{width:100%;height:100%}
</style>
</head>
<body>
<div id="map"></div>
<script>
  kakao.maps.load(function () {
    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울시청
      level: 5
    });
    console.log('kakao.maps 로드 성공, map 인스턴스:', map);
  });
</script>
</body>
</html>
